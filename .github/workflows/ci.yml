name: CI

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-package-build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 Release Package
            runner: ubuntu-24.04
            platform: linux-x86_64
            experimental: false
            run_tests: "1"
            strip: "1"
          - name: macOS Universal Release Package Probe
            runner: macos-15
            platform: macos-universal
            experimental: true
            cmake_osx_architectures: "x86_64;arm64"
            cmake_osx_deployment_target: "10.15"
            run_tests: "1"
            strip: "1"
          - name: Windows x86_64 Release Package Probe
            runner: ubuntu-22.04
            platform: windows-x86_64
            experimental: true
            cmake_toolchain_file: cmake/toolchains/mingw-x86_64.cmake
            run_tests: "0"
            strip: "0"
            build_jobs: "2"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            pkg-config \
            libdbus-1-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Install Windows cross build dependencies
        if: matrix.platform == 'windows-x86_64'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            mingw-w64

      - name: Show toolchain versions
        shell: bash
        run: |
          cmake --version
          ctest --version

      - name: Build, test, and package
        shell: bash
        env:
          DOWNSPOUT_BUILD_DIR: build/release-ci-${{ matrix.platform }}
          DOWNSPOUT_DIST_DIR: ${{ runner.temp }}/downspout-dist
          DOWNSPOUT_RELEASE_PLATFORM: ${{ matrix.platform }}
          DOWNSPOUT_VERSION: ci-${{ github.run_number }}
          DOWNSPOUT_CMAKE_TOOLCHAIN_FILE: ${{ matrix.cmake_toolchain_file }}
          DOWNSPOUT_CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_osx_architectures }}
          DOWNSPOUT_CMAKE_OSX_DEPLOYMENT_TARGET: ${{ matrix.cmake_osx_deployment_target }}
          DOWNSPOUT_RUN_TESTS: ${{ matrix.run_tests }}
          DOWNSPOUT_STRIP: ${{ matrix.strip }}
          DOWNSPOUT_BUILD_JOBS: ${{ matrix.build_jobs }}
        run: bash scripts/package-release.sh

      - name: Upload CI package
        uses: actions/upload-artifact@v4
        with:
          name: downspout-${{ matrix.platform }}-vst3
          path: ${{ runner.temp }}/downspout-dist/*
          if-no-files-found: error
          retention-days: 14
