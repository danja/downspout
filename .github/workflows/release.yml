name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-vst3:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64 VST3 Release
            runner: ubuntu-24.04
            platform: linux-x86_64
          - name: macOS arm64 VST3 Release
            runner: macos-15
            platform: macos-arm64
          - name: macOS x86_64 VST3 Release
            runner: macos-15-intel
            platform: macos-x86_64
          - name: Windows x86_64 VST3 Release
            runner: windows-2022
            platform: windows-x86_64

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake \
            g++ \
            pkg-config \
            libdbus-1-dev \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxext-dev \
            libxrandr-dev \
            libxrender-dev

      - name: Show toolchain versions
        shell: bash
        run: |
          cmake --version
          ctest --version

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "Unable to derive version from tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build, test, and package
        shell: bash
        env:
          DOWNSPOUT_BUILD_DIR: build/release-${{ matrix.platform }}
          DOWNSPOUT_DIST_DIR: ${{ runner.temp }}/downspout-dist
          DOWNSPOUT_RELEASE_PLATFORM: ${{ matrix.platform }}
          DOWNSPOUT_VERSION: ${{ steps.version.outputs.version }}
        run: bash scripts/package-release.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: downspout-${{ steps.version.outputs.version }}-${{ matrix.platform }}-vst3
          path: ${{ runner.temp }}/downspout-dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build-vst3

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/release-assets
          pattern: downspout-*-vst3
          merge-multiple: true

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET_DIR: ${{ runner.temp }}/release-assets
        run: |
          mapfile -t assets < <(find "$ASSET_DIR" -type f \( -name '*.zip' -o -name '*.sha256' \) | sort)
          if [ "${#assets[@]}" -ne 8 ]; then
            echo "Expected 8 release assets, found ${#assets[@]}:" >&2
            printf '%s\n' "${assets[@]}" >&2
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          if [ -z "$version" ]; then
            echo "Unable to derive version from tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          notes_file="$RUNNER_TEMP/release-notes.md"
          {
            echo "VST3 release builds for ${GITHUB_REF_NAME}."
            echo
            echo "Release assets:"
            echo "- downspout-${version}-linux-x86_64-vst3.zip"
            echo "- downspout-${version}-macos-arm64-vst3.zip"
            echo "- downspout-${version}-macos-x86_64-vst3.zip"
            echo "- downspout-${version}-windows-x86_64-vst3.zip"
            echo
            echo "Included plugin bundles:"
            echo "- bassgen.vst3"
            echo "- p_mix.vst3"
            echo "- e_mix.vst3"
            echo "- m_mix.vst3"
            echo "- melgen.vst3"
            echo "- rift.vst3"
            echo "- orchid.vst3"
            echo "- ambo.vst3"
            echo "- drumgen.vst3"
            echo "- drumkit.vst3"
            echo "- cadence.vst3"
            echo "- counterpointer.vst3"
            echo "- sidecar.vst3"
            echo "- gremlin.vst3"
            echo "- gremlin_driver.vst3"
            echo "- ground.vst3"
            echo "- floozy.vst3"
            echo "- basilico.vst3"
            echo "- canticle.vst3"
            echo "- luma.vst3"
            echo "- paunchlad.vst3"
            echo "- lifeform.vst3"
            echo "- xoxolo.vst3"
            echo
            echo "Each .sha256 asset contains the checksum for the matching zip."
          } > "$notes_file"

          gh release create "$GITHUB_REF_NAME" \
            "${assets[@]}" \
            --verify-tag \
            --title "downspout $GITHUB_REF_NAME" \
            --notes-file "$notes_file"
