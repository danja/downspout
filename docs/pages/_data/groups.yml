# Functional groups for the plugin index. Each product sets `group: <id>`.
# Order here is the order on the index page. `legacy` lists the old
# category anchors so existing links such as /#generative still land somewhere.
- id: generators
  title: Melody, Harmony & Bass Generators
  blurb: Write the notes for you: melodies, chords, counter-lines, basslines and long-form structure.
- id: rhythm
  title: Rhythm & Pattern Generators
  blurb: Drum patterns, polymeters, ghost notes, arpeggios and Launchpad grid sequencers.
- id: drums
  title: Drum & Percussion Voices
  blurb: MIDI-triggered kicks, snares, hats, cymbals and hand percussion.
- id: midi-tools
  title: MIDI Processing & Control
  blurb: Gate, retune, remember, capture and modulate MIDI; drive other plugins with CC.
- id: synths
  title: Synthesizers
  blurb: Tonal and physically modelled instruments: FM, wavetable, waveguide, modal, drone and bass.
- id: sources
  title: Samplers & Unusual Sound Sources
  blurb: Samplers, speech, birdsong, water, engines and glitch machines.
- id: tone
  title: Filters, Distortion & Tone Shaping
  blurb: Filters, vowels, EQ, saturation, lo-fi, amp modelling and resonators.
- id: space
  title: Delay, Reverb & Space
  blurb: Reverbs, delays, loopers, ambience and stereo movement.
- id: spectral
  title: Granular, Spectral & Pitch
  blurb: Grains, freezes, time stretch, vocoders, formant and pitch manipulation, buffer disruption.
- id: dynamics
  title: Dynamics, Gating & Mixing
  blurb: Compression, ducking, rhythmic gates and tremolo, mixing and output safety.
